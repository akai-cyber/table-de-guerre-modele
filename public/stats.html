<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guerre">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Stats · Table de guerre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="blason" id="blason" role="button" tabindex="0" aria-label="Informations du clan"><svg viewBox="0 0 50 56" aria-hidden="true"><path d="M25 3l19 6v17c0 13-8 22-19 27C14 48 6 39 6 26V9z" fill="#6A3FB8" stroke="#051A30" stroke-width="3.5" stroke-linejoin="round"/><path d="M25 8l14 4.6V26c0 9.8-5.8 16.8-14 21-8.2-4.2-14-11.2-14-21V12.6z" fill="#8B5CF0"/><path d="M16 21l5 4 4-8 4 8 5-4-2 13H18z" fill="#FFC928" stroke="#051A30" stroke-width="2" stroke-linejoin="round"/></svg></div>
  <div class="titre-entete"><h1 id="titreClan">Table de guerre</h1><small id="sous">Chargement…</small></div>
  <a class="btn carre sombre" id="chatBtn" href="/chat.html" aria-label="Chat du clan"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-message"/></svg><span class="pastille-nb" id="chatNb" hidden></span></a>
  <button class="btn" id="chefBtn" type="button" aria-expanded="false" aria-controls="chefPanel">Chef</button>
</header>
<div id="chefPanel" hidden>
  <form id="chefForm">
    <input id="chefCode" type="password" placeholder="Code chef" autocomplete="current-password" aria-label="Code chef">
    <button class="btn on" type="submit">Valider</button>
  </form>
  <p id="chefMsg" class="doux" role="status"></p>
</div>

<main>
  <section class="panneau" aria-labelledby="tBilan">
    <div class="entete-panneau"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-trophee"/></svg><h2 id="tBilan">Bilan du clan</h2></div>
    <div class="filtres-stats">
      <select id="fDerniers" aria-label="Période analysée"><option value="10">10 dernières guerres</option><option value="20">20 dernières guerres</option><option value="0">Toutes les guerres suivies</option></select>
      <select id="fType" aria-label="Type de guerre"><option value="tous">Guerres + ligue</option><option value="c">Guerres classiques</option><option value="l">Ligue de guerre (LDC)</option></select>
    </div>
    <div class="kpis" id="kpis" style="margin-top:10px"><div class="squelette" style="height:58px;grid-column:1/-1"></div></div>
  </section>

  <div class="onglets trois six" id="vues" role="tablist" aria-label="Vue">
    <button type="button" role="tab" class="puce-filtre on" data-vue="classement" aria-selected="true">Classement</button>
    <button type="button" role="tab" class="puce-filtre" data-vue="historique" aria-selected="false">Historique</button>
    <button type="button" role="tab" class="puce-filtre" data-vue="compos" aria-selected="false">Compos</button>
    <button type="button" role="tab" class="puce-filtre" data-vue="raids" aria-selected="false">Raids</button>
    <button type="button" role="tab" class="puce-filtre" data-vue="activite" aria-selected="false">Activité</button>
    <button type="button" role="tab" class="puce-filtre" data-vue="ldc" aria-selected="false">Ligue</button>
  </div>

  <section id="vueClassement" aria-label="Classement des joueurs">
    <div id="podium"></div>
    <div class="panneau creux" style="margin-top:14px">
      <div class="entete-panneau"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-medaille"/></svg><h2>Classement</h2>
        <button type="button" class="btn petit sombre droite" id="aideNote"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-info"/></svg>La note</button></div>
      <label class="doux" style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="fActuels" checked style="width:20px;min-height:20px"> Membres actuels seulement</label>
      <ul class="liste" id="classement"></ul>
    </div>
  </section>

  <section id="vueHistorique" hidden aria-label="Historique des guerres">
    <p class="doux" id="infoHisto"></p>
    <ul class="liste" id="historique"></ul>
  </section>

  <section id="vueCompos" hidden class="panneau creux" aria-labelledby="tCompos">
    <div class="entete-panneau"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-epees"/></svg><h2 id="tCompos">Compos du clan</h2></div>
    <div id="compos"></div>
  </section>

  <section id="vueRaids" hidden aria-label="Raids du Capital"><div class="squelette" style="height:120px"></div></section>
  <section id="vueActivite" hidden aria-label="Activité des membres"><div class="squelette" style="height:120px"></div></section>
  <section id="vueLdc" hidden aria-label="Ligue de guerre"><div class="squelette" style="height:120px"></div></section>

  <p class="doux mention">This material is unofficial and is not endorsed by Supercell. For more information see Supercell’s Fan Content Policy: www.supercell.com/fan-content-policy.</p>
</main>

<nav class="bas" aria-label="Navigation">
  <a href="/"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-epees"/></svg>Guerre</a>
  <a href="/board.html"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-carte"/></svg>Tableau</a>
  <a href="/stats.html" class="on" aria-current="page"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-stats"/></svg>Stats</a>
  <a href="/dispos.html"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-panneau"/></svg>Dispos</a>
  <a href="/menu.html"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-menu"/></svg>Menu</a>
  <a href="tdg://serveur" id="appServeur" class="srv" aria-label="Changer de serveur" hidden><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-serveur"/></svg></a>
</nav>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/stats.js"></script>
</body>
</html>
